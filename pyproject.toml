[project]
name = "madeleine-mcp"
dynamic = ["version"]
description = "Involuntary, cue-triggered memory for AI agents: sensory signals surface related memories without being asked."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "madeleine contributors" }]
keywords = ["mcp", "memory", "agents", "llm", "embeddings", "context", "proust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    # The MCP server touches a few SDK internals (resource subscriptions); pin to the tested
    # minor and widen deliberately (tests fail loudly if those internals move).
    "mcp>=2.3,<2.4",
    "mcp-types>=2.3,<2.4",
    "anyio>=4.0",
    "pydantic>=2.7",
    "starlette>=0.37",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
# Real text embeddings (sentence-transformers pulls in torch, so it is opt-in; see ADR 0002).
text = ["sentence-transformers>=3.0"]
image = ["open-clip-torch>=2.24", "pillow>=10.0", "torch>=2.2"]
audio = ["transformers>=4.40", "torch>=2.2", "soundfile>=0.12", "numpy>=1.26"]
all = ["madeleine-mcp[text,image,audio]"]

[project.scripts]
madeleine = "madeleine.cli:app"
madeleine-mcp = "madeleine.cli:app"

[project.urls]
Homepage = "https://github.com/FabianIMV/madeleine"
Repository = "https://github.com/FabianIMV/madeleine"
Issues = "https://github.com/FabianIMV/madeleine/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/madeleine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/madeleine"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", "PLAN.md", "REVIEW.md", ".github", ".claude", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "TID", "C4", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
"examples/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/madeleine"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*", "open_clip", "open_clip.*", "sentence_transformers", "sentence_transformers.*", "transformers", "transformers.*", "torch", "torch.*", "soundfile", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not models'"
markers = [
    "models: needs real ML models / network downloads (skipped by default; run with -m models)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
